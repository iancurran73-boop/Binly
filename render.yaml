# Render Blueprint \u2014 Binly binnovator (Phase B: 296 councils total).
#
# Phase B uses Dockerfile.selenium which ships Chrome + chromedriver, so
# Selenium-only councils (Gateshead, Stockton, etc.) work alongside the
# 205 pure-HTTP ones. Image is ~1.2 GB so we need a paid plan.
#
# Architecture: server.py runs the polling loop in a background thread and
# exposes a tiny HTTP server (/, /health, /tick) so Render is happy serving
# this as a Web Service. (Render free/hobby tier blocks Background Workers.)

services:
  - type: web
    name: binly-binnovator
    runtime: docker
    plan: standard
    autoDeploy: true
    rootDir: selenium-worker
    dockerfilePath: ./Dockerfile.selenium
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Both must be set in the Render dashboard before the first deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Phase B switch \u2014 actually run Selenium adapters.
      - key: ENABLE_SELENIUM
        value: "1"
      # Selenium jobs can take 30-60s each, so smaller batch + slightly longer
      # poll interval keeps the queue moving without thrashing.
      - key: WORKER_INTERVAL_SECONDS
        value: "5"
      - key: WORKER_BATCH_SIZE
        value: "2"
