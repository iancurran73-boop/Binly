# Render Blueprint — deploys the Binly binnovator that fetches bin schedules
# from UK council websites. Lives at repo root so Render's one-click Blueprint
# deploy auto-detects it.
#
# Why a Web Service (not a Worker)?
#   Render's free tier doesn't support Background Workers, only Web Services.
#   Our service.py runs the polling loop in a background thread and exposes
#   a tiny health-check HTTP server, so we get worker behaviour on the free
#   plan. To keep it from spinning down after 15 min idle, point an external
#   pinger (UptimeRobot, cron-job.org) at https://<service>.onrender.com/
#   every 10 minutes.
#
# Phase B (Selenium, 91 more councils) needs at least `starter` because the
# Chrome image has a larger footprint. Switch the plan field when ready.

services:
  - type: web
    name: binly-binnovator
    runtime: docker
    plan: free
    autoDeploy: true
    rootDir: selenium-worker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Both must be set in the Render dashboard before the first deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # How often the worker polls the Supabase queue (seconds).
      - key: WORKER_INTERVAL_SECONDS
        value: "5"
      # How many jobs to process per poll cycle.
      - key: WORKER_BATCH_SIZE
        value: "5"
